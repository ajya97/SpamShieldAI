{% extends "base.html" %}
{% block title %}Page not found | AI Spam Detector{% endblock %}

{% block content %}
<section class="error-page">
  <div class="error-page-inner fade-in-up">
    <span class="error-code">404</span>
    <h1>This page couldn't be found</h1>
    <p>The page you're looking for may have been moved or doesn't exist.</p>
    <a href="{{ url_for('main.home') }}" class="btn btn--primary">Back to home</a>
  </div>
</section>
{% endblock %}
